[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "estc-world-model"
version = "0.2.0"
description = "Entity-State-Transition-Constraint runtime for production-grade AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Josh Lee" }
]
keywords = ["ai-agents", "world-model", "estc", "state-machine", "neuro-symbolic", "agentic-ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyyaml>=6.0",
  "pydantic>=2.0.0"
]

[project.urls]
Homepage = "https://github.com/YOUR_ORG/estc-world-model"
Repository = "https://github.com/YOUR_ORG/estc-world-model"
Issues = "https://github.com/YOUR_ORG/estc-world-model/issues"

[tool.hatch.build.targets.wheel]
packages = ["estc_world_model"]
